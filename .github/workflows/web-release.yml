name: Build and deploy web

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Use empty R2 secrets for compile
        run: cp lib/core/config/r2_secrets.example.dart lib/core/config/r2_secrets.dart
      - name: Build web with R2 dart-defines
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_S3_API_URL: ${{ secrets.R2_S3_API_URL }}
          R2_REGION: ${{ secrets.R2_REGION }}
        run: |
          # NOTE: These dart-defines only bake upload credentials into the web
          # client. They never call Cloudflare's bucket/public-access APIs.
          flutter build web --release --base-href /dive-travel/ \
            --dart-define=R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" \
            --dart-define=R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" \
            --dart-define=R2_ACCOUNT_ID="${R2_ACCOUNT_ID}" \
            --dart-define=R2_PUBLIC_BASE_URL="${R2_PUBLIC_BASE_URL}" \
            --dart-define=R2_BUCKET_NAME="${R2_BUCKET_NAME:-dive-travel-app-storage}" \
            --dart-define=R2_S3_API_URL="${R2_S3_API_URL}" \
            --dart-define=R2_REGION="${R2_REGION:-auto}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # GitHub Pages deploy cannot change R2 settings. This job re-enables the
  # managed r2.dev public URL after each release so product covers stay readable
  # even if the dashboard toggle was flipped off elsewhere.
  ensure-r2-public:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure R2 r2.dev public access stays enabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          chmod +x scripts/ensure_r2_public.sh
          ./scripts/ensure_r2_public.sh
