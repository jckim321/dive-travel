name: dive_travel_app
description: "Multilingual worldwide scuba diving travel booking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  aws_signature_v4: ^0.6.13
  aws_common: ^0.7.15
  image_picker: ^1.2.3
  file_picker: ^13.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 1024x1024 PNG를 assets/icons/app_icon.png 에 넣은 뒤
# dart run flutter_launcher_icons 를 실행하면 Android/iOS 해상도별 아이콘이 교체됩니다.
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#0B1F33"
    theme_color: "#0B1F33"
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#0B1F33"
  adaptive_icon_foreground: assets/icons/app_icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
