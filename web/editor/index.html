<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dive Travel story editor (trial)</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #cdd5e0;
      --text: #152033;
      --muted: #5a6a7e;
      --accent: #1f4e79;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }
    .editor-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }
    .toolbar button,
    .toolbar select {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
    }
    .toolbar button:hover,
    .toolbar select:hover {
      border-color: var(--accent);
    }
    .toolbar button:active {
      background: #e8eef5;
    }
    .editor-surface {
      flex: 1;
      overflow: auto;
      padding: 12px 14px;
    }
    .ProseMirror {
      outline: none;
      min-height: 220px;
      line-height: 1.55;
      font-size: 15px;
    }
    .ProseMirror p { margin: 0 0 0.75em; }
    .ProseMirror h1,
    .ProseMirror h2,
    .ProseMirror h3 {
      margin: 0.4em 0 0.55em;
      line-height: 1.25;
    }
    .ProseMirror blockquote {
      margin: 0.6em 0;
      padding: 0.2em 0 0.2em 0.9em;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }
    .ProseMirror hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1em 0;
    }
    .ProseMirror a {
      color: #1565c0;
      text-decoration: underline;
    }
    .ProseMirror img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .ProseMirror video {
      display: block;
      max-width: 100%;
      width: 100%;
      height: auto;
      margin: 0.6em 0;
      background: #12324a;
    }
    .ProseMirror img[style*="text-align: center"],
    .ProseMirror span[style*="text-align: center"] > img,
    .ProseMirror div[style*="text-align: center"] > img {
      margin-left: auto;
      margin-right: auto;
    }
    .ProseMirror img[style*="text-align: right"],
    .ProseMirror span[style*="text-align: right"] > img,
    .ProseMirror div[style*="text-align: right"] > img {
      margin-left: auto;
    }
    .ProseMirror img[style*="text-align: left"],
    .ProseMirror span[style*="text-align: left"] > img,
    .ProseMirror div[style*="text-align: left"] > img {
      margin-right: auto;
    }
    .ProseMirror ul,
    .ProseMirror ol {
      padding-left: 1.4em;
      margin: 0.4em 0 0.8em;
    }
    .slash-menu {
      z-index: 40;
      min-width: 180px;
      max-height: 260px;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(21, 32, 51, 0.12);
      padding: 4px;
    }
    .slash-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .slash-menu-item:hover,
    .slash-menu-item.is-selected {
      background: #e8eef5;
    }
    .slash-menu-empty {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .bubble-menu {
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(21, 32, 51, 0.12);
      padding: 4px;
    }
    .bubble-menu button,
    .bubble-menu select {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
    }
    .bubble-menu button:hover,
    .bubble-menu select:hover {
      border-color: var(--accent);
    }
    .version-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(21, 32, 51, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .version-panel {
      width: min(360px, 100%);
      max-height: min(420px, 90vh);
      overflow: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 12px 32px rgba(21, 32, 51, 0.18);
    }
    .version-panel-title {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .version-empty {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .version-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .version-item,
    .version-close {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .version-item:hover,
    .version-close:hover {
      border-color: var(--accent);
    }
    .version-close {
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./editor.js"></script>
</body>
</html>
